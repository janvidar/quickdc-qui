#
## Continuous integration for quickdc-qui: the GUI over the core, with every
## submodule at the commit the superproject pins.
##
## Runs on the public GitHub mirror; Gitea reads .github/workflows too. The
## submodule URLs are relative, so a recursive checkout fetches the mirrors
## beside this repository.
##
## Windows is in the matrix before it builds: its job may fail until the port
## is done (docs/distribution.md, phase 2), and its log is the list of what is
## left.
#

name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.5.3'
  # The submodules' own suites as well as the GUI's, at the commits this tree pins.
  TEST_OPTIONS: -DQUICKDC_BUILD_TESTS=ON -DSAMURAI_BUILD_TESTS=ON -DDROP_BUILD_TESTS=ON -DEXOTIC_BUILD_TESTS=ON -DQUICKDC_REQUIRE_AUTOTESTS=ON

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            experimental: false
          - os: macos-15
            experimental: false
          - os: windows-2022
            experimental: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libbz2-dev libssl-dev \
            libgl1-mesa-dev libxkbcommon-x11-0 libfontconfig1 libegl1 desktop-file-utils

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3

      # vcpkg's built packages kept between runs: building OpenSSL takes minutes.
      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-openssl-zlib-bzip2-v1

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-cache"
          choco install -y ninja
          vcpkg install openssl:x64-windows zlib:x64-windows bzip2:x64-windows

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            extra+=(-DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake")
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug $TEST_OPTIONS "${extra[@]}"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          # Windows keeps going, so one run lists everything the port still has to do.
          keep=(); [ "$RUNNER_OS" = "Windows" ] && keep=(-- -k 0)
          cmake --build build "${keep[@]}" 2>&1 | tee build.log
          if grep -q 'warning:' build.log; then
            echo "::error::build produced warnings"
            grep 'warning:' build.log
            exit 1
          fi

      # The tests write under /tmp, which Windows reads as \tmp on the current drive.
      # To go once they ask for a temporary directory instead.
      - name: Make /tmp (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cmd //c "if not exist \\tmp mkdir \\tmp"

      # A bounded step, so a hanging test ends the job with its log rather than
      # running until someone cancels it (a cancelled job keeps no log).
      - name: Test
        shell: bash
        timeout-minutes: 30
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          limit=300; bound=()
          # On Windows the step's own timeout does not reach ctest's children, so ctest
          # is bounded itself (macOS has no timeout(1), and does not need one).
          [ "$RUNNER_OS" = "Windows" ] && { limit=20; bound=(timeout 1500); }
          "${bound[@]}" ctest --test-dir build -LE net --output-on-failure -j4 --timeout $limit

      # QtTest's own output does not reach ctest on Windows; a file does.
      - name: GUI test detail (Windows)
        if: failure() && runner.os == 'Windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for t in hubs bridge settings; do
            exe=build/tests/tst_$t.exe
            [ -x "$exe" ] || continue
            status=0
            timeout 120 "$exe" -o "tst_$t.txt,txt" > /dev/null 2>&1 || status=$?
            echo "== tst_$t (exit $status)"
            grep -E 'FAIL!|Loc:|Totals|QFATAL|Actual|Expected' "tst_$t.txt" | head -30 || true
          done

      - name: Test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.os }}
          path: build/Testing/Temporary/LastTest*
          if-no-files-found: ignore

  sanitizers:
    name: sanitizers (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libbz2-dev libssl-dev \
            libgl1-mesa-dev libxkbcommon-x11-0 libfontconfig1 libegl1 desktop-file-utils

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug $TEST_OPTIONS -DQUICKDC_SANITIZE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp
        run: ctest --test-dir build -LE net --output-on-failure -j4 --timeout 300

  # Emulated networks in rootless podman. Nightly and by hand: it takes minutes.
  # dropd, DROP's own server, is built from its repository for the reachability
  # scenarios.
  net:
    name: net (podman)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: janvidar/drop
          path: drop

      - uses: actions/setup-go@v5
        with:
          go-version-file: drop/go.mod
          cache-dependency-path: drop/go.sum

      - name: Build dropd
        run: cd drop && go build -o "$GITHUB_WORKSPACE/dropd" ./cmd/dropd

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libbz2-dev libssl-dev podman

      - name: Configure
        run: |
          cmake -S quickdc -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DQUICKDC_BUILD_CLI=ON -DQUICKDC_BUILD_TESTS=ON -DQUICKDC_DROPD="$GITHUB_WORKSPACE/dropd"

      - name: Build
        run: cmake --build build --target qdc

      - name: Test
        env:
          NET_KEEP: failed
        run: ctest --test-dir build -L net --output-on-failure -j2 --timeout 600
